.k:active{filter:brightness(1.4)}

<body>
<div id="app"><div class="center mut">Chargement…</div></div>
<div id="lock" hidden>
  <div id="cdisp">0</div>
  <div class="pad" id="pad"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
"use strict";
/* ============ Configuration ============ */
const SB_URL = "https://pzjaocwgfpsarucwbuwc.supabase.co";
const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InB6amFvY3dnZnBzYXJ1Y3didXdjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI3MDM4NDcsImV4cCI6MjEwODI3OTg0N30.KonFAV0fJLZfsAB_8DPzCT7gOSi9NHqwp-BI3e7ynM8";
const sb = supabase.createClient(SB_URL, SB_KEY);

/* ============ Outils ============ */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const S = { user: null, profile: null, priv: null, sub: null, ver: null, tab: "discover", queue: [], queueLoaded: false, conv: null, unread: 0, timers: {} };
let recovery = false;
const ALT = { calculatrice: ["Calculatrice", "🧮"], notes: ["Notes", "📝"], meteo: ["Météo", "⛅"] };
const SKIP_KEY = "discret_skip";

function toast(m, err) {
  const t = document.createElement("div");
  t.className = "toast" + (err ? " err" : "");
  t.textContent = m;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 3400);
}
function sheet(html) {
  const o = document.createElement("div");
  o.className = "ov";
  o.innerHTML = '<div class="sh">' + html + "</div>";
  o.addEventListener("click", e => { if (e.target === o) o.remove(); });
  document.body.appendChild(o);
  return o;
}
function age(d) {
  const b = new Date(d), n = new Date();
  let a = n.getFullYear() - b.getFullYear();
  const m = n.getMonth() - b.getMonth();
  if (m < 0 || (m === 0 && n.getDate() < b.getDate())) a--;
  return a;
}
function hm(d) { return new Date(d).toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" }); }
function fr(e) {
  const m = (e && e.message) || String(e);
  if (/Invalid login/i.test(m)) return "E-mail ou mot de passe incorrect.";
  if (/already registered|already been registered/i.test(m)) return "Un compte existe déjà avec cet e-mail.";
  if (/not confirmed/i.test(m)) return "Confirme d’abord ton e-mail (vérifie ta boîte de réception).";
  if (/at least|weak|short/i.test(m)) return "Mot de passe trop faible (8 caractères minimum).";
  if (/rate limit|too many/i.test(m)) return "Trop de tentatives, réessaie dans quelques minutes.";
  if (/Failed to fetch|network/i.test(m)) return "Connexion impossible. Vérifie ton réseau.";
  return m;
}
async function busy(btn, fn) {
  btn.disabled = true;
  try { await fn(); } finally { btn.disabled = false; }
}
function clearTimers() { Object.values(S.timers).forEach(clearInterval); S.timers = {}; }
function setAlt() {
  const a = ALT[(S.priv && S.priv.alt_icon)] || ALT.calculatrice;
  document.title = a[0];
  const svg = "<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>" + a[1] + "</text></svg>";
  $("#fav").href = "data:image/svg+xml," + encodeURIComponent(svg);
}

/* ============ Photos (URLs signées) ============ */
const URLS = new Map();
async function signed(paths) {
  const now = Date.now();
  const need = paths.filter(p => !URLS.has(p) || URLS.get(p).exp < now);
  if (need.length) {
    const { data } = await sb.storage.from("photos").createSignedUrls(need, 3600);
    (data || []).forEach(d => { if (d.signedUrl) URLS.set(d.path, { url: d.signedUrl, exp: now + 3300000 }); });
  }
}
const urlOf = p => (URLS.get(p) && URLS.get(p).url) || "";
function avatar(p, url) {
  return '<div class="av">' + (url ? '<img alt="" src="' + esc(url) + '">' : esc((p.display_name || "?").charAt(0).toUpperCase())) + "</div>";
}

/* ============ Mode discret : calculatrice + code ============ */
const PIN_KEY = "discret_pin";
let ex = "", locked = false, awayAt = 0;
const hasPin = () => !!localStorage.getItem(PIN_KEY);
const sha = async s => [...new Uint8Array(await crypto.subtle.digest("SHA-256", new TextEncoder().encode("discret:" + s)))].map(b => b.toString(16).padStart(2, "0")).join("");

(function buildPad() {
  const keys = ["C", "⌫", "÷", "×", "7", "8", "9", "−", "4", "5", "6", "+", "1", "2", "3", "=", "0", "."];
  $("#pad").innerHTML = keys.map(k => {
    let c = "k";
    if (["C", "⌫"].includes(k)) c += " fn";
    else if (["÷", "×", "−", "+"].includes(k)) c += " op";
    if (k === "=") c += " eq";
    if (k === "0") c += " z";
    return '<button class="' + c + '" data-k="' + k + '">' + k + "</button>";
  }).join("");
  $("#pad").addEventListener("click", e => { const b = e.target.closest("button"); if (b) calcKey(b.dataset.k); });
})();

function drawCalc() { $("#cdisp").textContent = ex || "0"; }
function calc(s) {
  if (!s) return "";
  const t = s.replace(/×/g, "*").replace(/÷/g, "/").replace(/−/g, "-");
  if (!/^[0-9+\-*/.() ]+$/.test(t)) return "Erreur";
  try {
    const r = Function('"use strict";return (' + t + ")")();
    return Number.isFinite(r) ? String(Math.round(r * 1e8) / 1e8) : "Erreur";
  } catch (e) { return "Erreur"; }
}
async function calcKey(k) {
  if (ex === "Erreur" && k !== "C" && k !== "=") ex = "";
  if (k === "C") ex = "";
  else if (k === "⌫") ex = ex.slice(0, -1);
  else if (k === "=") {
    if (/^\d{4,6}$/.test(ex) && hasPin() && (await sha(ex)) === localStorage.getItem(PIN_KEY)) { unlock(); return; }
    ex = calc(ex);
  } else if (ex.length < 24) ex += k;
  drawCalc();
}
function showLock() {
  locked = true; ex = ""; drawCalc();
  $("#lock").hidden = false;
  clearTimers();
}
function unlock() {
  locked = false; ex = ""; drawCalc();
  $("#lock").hidden = true;
  if (S.user && S.profile) showShell(); else boot();
}
document.addEventListener("visibilitychange", () => {
  if (document.hidden) awayAt = Date.now();
  else if (hasPin() && !locked && awayAt && Date.now() - awayAt > 20000) showLock();
});
function askPin(title) {
  return new Promise(res => {
    const o = sheet('<h2>' + esc(title) + '</h2><input id="pn" type="password" inputmode="numeric" maxlength="6" placeholder="4 à 6 chiffres" autocomplete="off"><button class="btn" id="po">Valider</button><button class="btn ghost" id="pc">Annuler</button>');
    let done = false;
    const end = v => { if (!done) { done = true; o.remove(); res(v); } };
    $("#po", o).onclick = () => end($("#pn", o).value.trim());
    $("#pc", o).onclick = () => end(null);
    o.addEventListener("click", e => { if (e.target === o) end(null); });
    setTimeout(() => $("#pn", o).focus(), 50);
  });
}
async function checkPin() {
  const v = await askPin("Entre ton code actuel");
  if (v === null) return false;
  if ((await sha(v)) === localStorage.getItem(PIN_KEY)) return true;
  toast("Code incorrect", 1); return false;
}
async function setPin() {
  const a = await askPin("Choisis un code (4 à 6 chiffres)");
  if (a === null) return false;
  if (!/^\d{4,6}$/.test(a)) { toast("Le code doit faire 4 à 6 chiffres", 1); return false; }
  const b = await askPin("Confirme ton code");
  if (b === null) return false;
  if (a !== b) { toast("Les deux codes sont différents", 1); return false; }
  localStorage.setItem(PIN_KEY, await sha(a));
  return true;
}

/* ============ Démarrage ============ */
sb.auth.onAuthStateChange((ev) => {
  if (ev === "PASSWORD_RECOVERY") { recovery = true; showRecovery(); }
  else if (ev === "SIGNED_OUT") { S.user = null; S.profile = null; S.queueLoaded = false; S.conv = null; clearTimers(); if (!locked) showAuth(); }
});
async function boot() {
  const { data: { session } } = await sb.auth.getSession();
  if (recovery) return;
  if (!session) { S.user = null; return showAuth(); }
  S.user = session.user;
  await loadMe();
}
async function loadMe() {
  const uid = S.user.id;
  const { data: p, error } = await sb.from("profiles").select("*").eq("id", uid).maybeSingle();
  if (error) return showFatal(fr(error));
  if (!p) return showOnboarding();
  S.profile = p;
  if (p.is_banned) return showBanned();
  const [a, b, c] = await Promise.all([
    sb.from("privacy_settings").select("*").eq("user_id", uid).maybeSingle(),
    sb.from("subscriptions").select("*").eq("user_id", uid).maybeSingle(),
    sb.from("verifications").select("*").eq("user_id", uid).maybeSingle()
  ]);
  S.priv = a.data || {}; S.sub = b.data; S.ver = c.data;
  setAlt();
  showShell();
}
function showFatal(m) {
  $("#app").innerHTML = '<div class="auth"><div class="logo">Discret</div><p class="mut">Un problème est survenu : ' + esc(m) + '</p><button class="btn" id="rt">Réessayer</button></div>';
  $("#rt").onclick = boot;
}
function showBanned() {
  $("#app").innerHTML = '<div class="auth"><div class="logo">Discret</div><h2>Compte suspendu</h2><p class="mut">Ce compte a été suspendu suite à un signalement.</p><button class="btn ghost" id="so">Se déconnecter</button></div>';
  $("#so").onclick = () => sb.auth.signOut();
}

/* ============ Connexion / inscription ============ */
function showAuth(mode) {
  mode = mode || "in";
  const up = mode === "up";
  $("#app").innerHTML = '<div class="auth"><div class="logo">Discret</div><p class="tag">Des rencontres entre adultes.<br>Tout reste entre nous.</p>' +
    '<div class="seg"><button data-m="in" class="' + (up ? "" : "on") + '">Connexion</button><button data-m="up" class="' + (up ? "on" : "") + '">Créer un compte</button></div>' +
    '<label>E-mail<input id="em" type="email" autocomplete="email" inputmode="email"></label>' +
    '<label>Mot de passe<input id="pw" type="password" autocomplete="' + (up ? "new-password" : "current-password") + '"></label>' +
    (up ? '<label class="chk"><input type="checkbox" id="ok18"><span>Je confirme avoir 18 ans ou plus et j’accepte que mon profil soit visible des autres membres.</span></label>' : "") +
    '<div id="am"></div><button class="btn" id="go">' + (up ? "Créer mon compte" : "Se connecter") + "</button>" +
    (up ? "" : '<button class="link" id="fg">Mot de passe oublié ?</button>') + "</div>";
  $$(".seg button").forEach(b => b.onclick = () => showAuth(b.dataset.m));
  $("#pw").addEventListener("keydown", e => { if (e.key === "Enter") $("#go").click(); });
  $("#go").onclick = () => busy($("#go"), async () => {
    const email = $("#em").value.trim(), pw = $("#pw").value;
    if (!email || !pw) return toast("Remplis tous les champs", 1);
    if (up) {
      if (pw.length < 8) return toast("8 caractères minimum", 1);
      if (!$("#ok18").checked) return toast("Tu dois avoir 18 ans ou plus", 1);
      const { data, error } = await sb.auth.signUp({ email, password: pw, options: { emailRedirectTo: location.origin + location.pathname } });
      if (error) return toast(fr(error), 1);
      if (!data.session) { $("#am").innerHTML = '<div class="msg">Compte créé ! Vérifie ta boîte e-mail pour confirmer ton adresse, puis reviens te connecter.</div>'; return; }
      S.user = data.user; await loadMe();
    } else {
      const { data, error } = await sb.auth.signInWithPassword({ email, password: pw });
      if (error) return toast(fr(error), 1);
      S.user = data.user; await loadMe();
    }
  });
  const fg = $("#fg");
  if (fg) fg.onclick = async () => {
    const email = $("#em").value.trim();
    if (!email) return toast("Entre d’abord ton e-mail", 1);
    const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: location.origin + location.pathname });
    if (error) return toast(fr(error), 1);
    $("#am").innerHTML = '<div class="msg">Si un compte existe avec cet e-mail, un lien de réinitialisation vient d’être envoyé.</div>';
  };
}
function showRecovery() {
  $("#app").innerHTML = '<div class="auth"><div class="logo">Discret</div><h2>Nouveau mot de passe</h2><label>Mot de passe (8 caractères minimum)<input id="np" type="password" autocomplete="new-password"></label><button class="btn" id="ns">Enregistrer</button></div>';
  $("#ns").onclick = () => busy($("#ns"), async () => {
    const pw = $("#np").value;
    if (pw.length < 8) return toast("8 caractères minimum", 1);
    const { error } = await sb.auth.updateUser({ password: pw });
    if (error) return toast(fr(error), 1);
    recovery = false; toast("Mot de passe mis à jour");
    history.replaceState(null, "", location.pathname);
    boot();
  });
}

    [["discover", "♥", "Découvrir"], ["messages", "💬", "Messages"], ["profile", "👤", "Profil"], ["settings", "⚙️", "Réglages"]]
      .map(t => '<button data-t="' + t[0] + '"><span class="ic">' + t[1] + "</span>" + t[2] + (t[0] === "messages" ? '<span class="badge" id="ub" hidden></span>' : "") + "</button>").join("") + "</nav>";

function go(t) {
  S.tab = t; stopChat();
  $$(".tabs button").forEach(b => b.classList.toggle("on", b.dataset.t === t));
  $("#view").className = "";
  ({ discover: viewDiscover, messages: viewMessages, profile: viewProfile, settings: viewSettings })[t]();
  $("#view").scrollTop = 0;
}
async function refreshUnread() {
  if (!S.user || locked) return;
  const { count } = await sb.from("messages").select("id", { count: "exact", head: true }).neq("sender_id", S.user.id).is("read_at", null);
  S.unread = count || 0;
  const b = $("#ub");
  if (b) { b.textContent = S.unread; b.hidden = !S.unread; }
}

/* ============ Découvrir ============ */
const getSkip = () => { try { return new Set(JSON.parse(localStorage.getItem(SKIP_KEY) || "[]")); } catch (e) { return new Set(); } };
const addSkip = id => { const s = [...getSkip(), id].slice(-500); localStorage.setItem(SKIP_KEY, JSON.stringify(s)); };

async function loadQueue() {
  const { data: lk } = await sb.from("likes").select("to_id").eq("from_id", S.user.id);
  const liked = new Set((lk || []).map(x => x.to_id));
  const skip = getSkip();
  const { data: ps, error } = await sb.from("profiles").select("id,display_name,birth_date,bio,gender,looking_for,city,photo_urls")
    .neq("id", S.user.id).order("created_at", { ascending: false }).limit(80);
  if (error) { toast(fr(error), 1); S.queue = []; return; }
  const want = S.profile.looking_for;
  S.queue = (ps || []).filter(p => !liked.has(p.id) && !skip.has(p.id) && (want === "tous" || !want || p.gender === want));
  S.queueLoaded = true;
}
async function viewDiscover() {
  $("#view").innerHTML = '<div class="center mut">Chargement…</div>';
  if (!S.queueLoaded) await loadQueue();
  if (S.tab === "discover") drawCard();
}
async function drawCard() {
  const v = $("#view"), p = S.queue[0];
  if (!p) {
    v.innerHTML = '<div class="empty"><div class="big">✦</div><h2>Plus de profils pour l’instant</h2><p class="mut">Reviens un peu plus tard, de nouvelles personnes arrivent régulièrement.</p><button class="btn" id="rf">Actualiser</button><button class="btn ghost" id="rs">Revoir les profils passés</button></div>';
    $("#rf").onclick = async () => { S.queueLoaded = false; viewDiscover(); };
    $("#rs").onclick = async () => { localStorage.removeItem(SKIP_KEY); S.queueLoaded = false; viewDiscover(); };
    return;
  }
  const paths = p.photo_urls || [];
  await signed(paths);
  let idx = 0;
  const imgs = paths.map(urlOf).filter(Boolean);
  v.innerHTML = '<div class="card"><div class="ph" id="ph"></div><div class="info">' + (p.bio ? "<p>" + esc(p.bio) + "</p>" : "") + "</div>" +
    '<div class="acts"><button class="rb x" id="pass" aria-label="Passer">✕</button><button class="rb h" id="like" aria-label="J’aime">♥</button><button class="rb m" id="more" aria-label="Plus">⋯</button></div></div>';
  const ph = $("#ph");
  const paint = () => {
    ph.innerHTML = (imgs.length ? '<img alt="" src="' + esc(imgs[idx]) + '">' : '<div class="ini">' + esc(p.display_name.charAt(0).toUpperCase()) + "</div>") +
      (imgs.length > 1 ? '<div class="dots">' + imgs.map((_, i) => '<i class="' + (i === idx ? "on" : "") + '"></i>').join("") + "</div>" : "") +
      '<div class="cap"><div class="nm">' + esc(p.display_name) + ", " + age(p.birth_date) + "</div>" + (p.city ? '<div class="ct">' + esc(p.city) + "</div>" : "") + "</div>";
  };
  paint();
  ph.onclick = e => {
    if (imgs.length < 2) return;
    const r = ph.getBoundingClientRect();
    idx = e.clientX < r.left + r.width / 2 ? (idx + imgs.length - 1) % imgs.length : (idx + 1) % imgs.length;
    paint();
  };
  $("#pass").onclick = () => { addSkip(p.id); S.queue.shift(); drawCard(); };
  $("#like").onclick = () => busy($("#like"), async () => {
    const { data, error } = await sb.rpc("like_user", { target: p.id });
    if (error) {
      if (/indisponible/i.test(error.message)) { toast("Ce profil n’est plus disponible"); S.queue.shift(); return drawCard(); }
      return toast(fr(error), 1);
    }
    if (data === "limit") {
      sheet('<h2>Limite atteinte</h2><p class="mut">Tu as utilisé tes 20 « J’aime » des dernières 24 heures. Reviens plus tard, ou passe en Premium pour en envoyer sans limite.</p><button class="btn ghost" onclick="this.closest(\'.ov\').remove()">Compris</button>');
      return;
    }
    S.queue.shift();
    if (data === "match") {
      const o = sheet('<h2>C’est un match ! 🎉</h2><p class="mut">Toi et ' + esc(p.display_name) + " vous plaisez mutuellement. Vous pouvez maintenant discuter.</p>" +
        '<button class="btn" id="mw">Écrire un message</button><button class="btn ghost" id="mc">Continuer</button>');
      $("#mw", o).onclick = () => { o.remove(); go("messages"); };
      $("#mc", o).onclick = () => o.remove();
    }
    drawCard();
  });
  $("#more").onclick = () => profileMenu(p, () => { S.queue.shift(); drawCard(); });
}
function profileMenu(p, after) {
  const o = sheet('<h2>' + esc(p.display_name) + '</h2><button class="btn ghost" id="rp">🚩 Signaler</button><button class="btn danger" id="bl">⛔ Bloquer</button><button class="btn ghost" id="cn">Annuler</button>');
  $("#cn", o).onclick = () => o.remove();
  $("#bl", o).onclick = async () => {
    const { error } = await sb.from("blocks").insert({ blocker_id: S.user.id, blocked_id: p.id });
    o.remove();
    if (error && error.code !== "23505") return toast(fr(error), 1);
    toast(p.display_name + " est bloqué(e)"); after();
  };
  $("#rp", o).onclick = () => {
    o.remove();
    const reasons = ["Faux profil ou arnaque", "Contenu inapproprié", "Harcèlement", "Personne mineure suspectée", "Autre"];
    const r = sheet("<h2>Pourquoi signaler ?</h2>" + reasons.map((x, i) => '<button class="btn ghost" data-i="' + i + '">' + esc(x) + "</button>").join(""));
    $$("button", r).forEach(b => b.onclick = async () => {
      const { error } = await sb.from("reports").insert({ reporter_id: S.user.id, reported_id: p.id, reason: reasons[b.dataset.i] });
      r.remove();
      if (error) return toast(fr(error), 1);
      toast("Merci, ton signalement a bien été envoyé"); after();
    });
  };
}

async function viewMessages() {
  const v = $("#view");
  v.innerHTML = '<h1>Messages</h1><div class="center mut">Chargement…</div>';
  const { data: cs, error } = await sb.from("conversations").select("id,user_a,user_b,created_at").order("created_at", { ascending: false });
  if (error) { v.innerHTML = '<h1>Messages</h1><p class="mut">' + esc(fr(error)) + "</p>"; return; }
  if (!cs || !cs.length) {
    v.innerHTML = '<h1>Messages</h1><div class="empty"><div class="big">💬</div><p class="mut">Pas encore de conversation.<br>Quand tu auras un match, vous pourrez discuter ici.</p></div>';
    return;
  }
  const others = cs.map(c => c.user_a === S.user.id ? c.user_b : c.user_a);
  const { data: ps } = await sb.from("profiles").select("id,display_name,photo_urls").in("id", others);
  const pm = new Map((ps || []).map(p => [p.id, p]));
  const { data: ms } = await sb.from("messages").select("conversation_id,sender_id,body,created_at,read_at")
    .in("conversation_id", cs.map(c => c.id)).order("created_at", { ascending: false }).limit(300);
  const last = new Map(), unread = new Set();
  (ms || []).forEach(m => {
    if (!last.has(m.conversation_id)) last.set(m.conversation_id, m);
    if (m.sender_id !== S.user.id && !m.read_at) unread.add(m.conversation_id);
  });
  const rows = cs.map((c, i) => ({ c, p: pm.get(others[i]), m: last.get(c.id) })).filter(r => r.p)
    .sort((a, b) => new Date((b.m || b.c).created_at) - new Date((a.m || a.c).created_at));
  await signed(rows.map(r => (r.p.photo_urls || [])[0]).filter(Boolean));
  if (S.tab !== "messages" || S.conv) return;
  v.innerHTML = "<h1>Messages</h1>" + (rows.length ? rows.map((r, i) =>
    '<div class="row" data-i="' + i + '">' + avatar(r.p, urlOf((r.p.photo_urls || [])[0])) +
    '<div class="t' + (unread.has(r.c.id) ? " un" : "") + '"><b>' + esc(r.p.display_name) + "</b><span>" +
    (r.m ? (r.m.sender_id === S.user.id ? "Toi : " : "") + esc(r.m.body) : "Nouveau match ! Dis bonjour 👋") + "</span></div>" +
    (unread.has(r.c.id) ? '<div class="dot"></div>' : "") + "</div>").join("") : '<p class="mut">Aucune conversation disponible.</p>');
  $$(".row", v).forEach(el => el.onclick = () => openChat(rows[el.dataset.i].c.id, rows[el.dataset.i].p));
}
async function openChat(id, p) {
  S.conv = { id, p, sig: "" };
  await signed((p.photo_urls || [])[0] ? [p.photo_urls[0]] : []);
  const v = $("#view");
  v.className = "np";
  v.innerHTML = '<div class="chead"><button id="bk" aria-label="Retour">‹</button>' + avatar(p, urlOf((p.photo_urls || [])[0])) +
    "<b>" + esc(p.display_name) + '</b><button id="mo" aria-label="Plus">⋯</button></div><div class="msgs" id="msgs"></div>' +
    '<div class="cin"><input id="mi" maxlength="2000" placeholder="Écris un message…" autocomplete="off"><button id="sd" aria-label="Envoyer">➤</button></div>';
  $("#bk").onclick = () => { stopChat(); go("messages"); };
  $("#mo").onclick = () => profileMenu(p, () => { stopChat(); go("messages"); });
  $("#sd").onclick = sendMsg;
  $("#mi").addEventListener("keydown", e => { if (e.key === "Enter") sendMsg(); });
  await loadMsgs(true);
  S.timers.chat = setInterval(() => loadMsgs(false), 4000);
}
function stopChat() { if (S.timers.chat) { clearInterval(S.timers.chat); delete S.timers.chat; } S.conv = null; }
async function loadMsgs(force) {
  if (!S.conv) return;
  const id = S.conv.id;
  const { data, error } = await sb.from("messages").select("id,sender_id,body,created_at,read_at").eq("conversation_id", id).order("created_at", { ascending: true }).limit(300);
  if (error || !S.conv || S.conv.id !== id) return;
  const lastM = data[data.length - 1];
  const sig = data.length + ":" + (lastM ? lastM.id : "") + ":" + data.filter(m => m.read_at).length;
  if (!force && sig === S.conv.sig) return;
  S.conv.sig = sig;
  const box = $("#msgs");
  if (!box) return;
  const near = box.scrollHeight - box.scrollTop - box.clientHeight < 80;
  box.innerHTML = data.length ? data.map(m => '<div class="b ' + (m.sender_id === S.user.id ? "me" : "th") + '">' + esc(m.body) + "<span>" + hm(m.created_at) + (m.sender_id === S.user.id && m.read_at ? " ✓✓" : "") + "</span></div>").join("")
    : '<div class="center mut">Dis bonjour 👋</div>';
  if (force || near) box.scrollTop = box.scrollHeight;
  if (data.some(m => m.sender_id !== S.user.id && !m.read_at)) {
    await sb.from("messages").update({ read_at: new Date().toISOString() }).eq("conversation_id", id).neq("sender_id", S.user.id).is("read_at", null);
    refreshUnread();
  }
}
async function sendMsg() {
  const i = $("#mi");
  const body = i.value.trim();
  if (!body || !S.conv) return;
  i.value = "";
  const { error } = await sb.from("messages").insert({ conversation_id: S.conv.id, sender_id: S.user.id, body });
  if (error) { i.value = body; return toast("Message non envoyé (profil bloqué ou indisponible).", 1); }
  await loadMsgs(true);
}

/* ============ Mon profil + photos ============ */
function resizeImage(file) {
  return new Promise((res, rej) => {
    const img = new Image();
    const u = URL.createObjectURL(file);
    img.onload = () => {
      const m = 1280, k = Math.min(1, m / Math.max(img.width, img.height));
      const c = document.createElement("canvas");
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(u);
      c.toBlob(b => b ? res(b) : rej(new Error("Image illisible")), "image/jpeg", 0.85);
    };
    img.onerror = () => { URL.revokeObjectURL(u); rej(new Error("Image illisible")); };
    img.src = u;
  });
}

    } catch (err) { toast(err.message || "Photo illisible", 1); }
  };
  $$("[data-d]", v).forEach(b => b.onclick = async () => {
    const i = +b.dataset.d, path = S.profile.photo_urls[i];
    const arr = S.profile.photo_urls.filter((_, k) => k !== i);
    const { error } = await sb.from("profiles").update({ photo_urls: arr }).eq("id", S.user.id);
    if (error) return toast(fr(error), 1);
    await sb.storage.from("photos").remove([path]);
    S.profile.photo_urls = arr; viewProfile();
  });
  $$("[data-u]", v).forEach(b => b.onclick = async () => {
    const i = +b.dataset.u, arr = [...S.profile.photo_urls];
    arr.unshift(arr.splice(i, 1)[0]);
    const { error } = await sb.from("profiles").update({ photo_urls: arr }).eq("id", S.user.id);
    if (error) return toast(fr(error), 1);
    S.profile.photo_urls = arr; viewProfile();
  });
  $("#sv").onclick = () => busy($("#sv"), async () => {
    const dn = $("#dn").value.trim();
    if (dn.length < 2) return toast("Le pseudo doit faire au moins 2 caractères", 1);
    const patch = { display_name: dn, gender: $("#gd").value, looking_for: $("#lf").value, city: $("#ct").value.trim() || null, bio: $("#bi").value.trim() || null, is_visible: $("#vi").checked };
    const { error } = await sb.from("profiles").update(patch).eq("id", S.user.id);
    if (error) return toast(fr(error), 1);
    Object.assign(S.profile, patch); S.queueLoaded = false;
    toast("Profil enregistré ✓");
  });
}

/* ============ Réglages ============ */
async function setPriv(k, v) {
  const { error } = await sb.from("privacy_settings").upsert({ user_id: S.user.id, [k]: v });
  if (error) { toast(fr(error), 1); return false; }
  S.priv[k] = v;
  if (k === "alt_icon") setAlt();
  return true;
}
function viewSettings() {
  const v = $("#view"), pin = hasPin(), pr = S.priv || {};
  const prem = S.sub && S.sub.plan === "premium" && (!S.sub.expires_at || new Date(S.sub.expires_at) > new Date());
  const vs = S.ver && S.ver.status;
  v.innerHTML = "<h1>Réglages</h1>" +
    "<h3>Mode discret</h3><div class=\"box\"><p class=\"mut\" style=\"margin-top:0\">Quand il est actif, l’application s’ouvre comme une simple calculatrice. Tape ton code puis « = » pour entrer.</p>" +
    (pin ? '<button class="btn" id="lk">🔒 Verrouiller maintenant</button><button class="btn ghost" id="cp">Changer le code</button><button class="btn ghost" id="dp">Désactiver le mode discret</button>' : '<button class="btn" id="ap">Activer le mode discret</button>') +
    '<p class="mut" style="font-size:13px;margin-bottom:0">Le code reste uniquement sur cet appareil. En cas d’oubli, efface les données du site dans ton navigateur puis reconnecte-toi.</p></div>' +
    '<div class="box"><label style="margin-top:0">Apparence de l’onglet et du nom<select id="ai">' + Object.entries(ALT).map(([k, a]) => '<option value="' + k + '"' + ((pr.alt_icon || "calculatrice") === k ? " selected" : "") + ">" + a[1] + " " + a[0] + "</option>").join("") + "</select></label>" +
    '<div class="sw"><span>Notifications neutres</span><input type="checkbox" id="nn"' + (pr.neutral_notifications !== false ? " checked" : "") + '></div>' +
    '<div class="sw"><span>Masquer ma dernière connexion</span><input type="checkbox" id="hl"' + (pr.hide_last_seen !== false ? " checked" : "") + "></div></div>" +
    "<h3>Mon compte</h3><div class=\"box\"><div class=\"sw\"><span>Abonnement</span><span class=\"pill" + (prem ? " ok" : "") + "\">" + (prem ? "Premium" : "Gratuit") + "</span></div>" +
    (prem ? "" : '<p class="mut" style="font-size:13px;margin:0">Gratuit : 20 « J’aime » par 24 h. Le Premium arrive bientôt.</p>') +
    '<div class="sw"><span>Vérification du profil</span><span class="pill' + (vs === "verified" ? " ok" : "") + '">' + (vs === "verified" ? "Vérifié ✓" : vs === "rejected" ? "Refusée" : "Non vérifié") + "</span></div>" +
    '<p class="mut" style="font-size:13px;margin:0">E-mail : ' + esc(S.user.email || "") + "</p></div>" +
    '<button class="btn ghost" id="ub2">Débloquer tous les profils</button><button class="btn ghost" id="so">Se déconnecter</button>' +
    '<p class="mut center" style="font-size:12px">Discret · réservé aux adultes (18+)</p>';
  const on = (id, fn) => { const e = $(id, v); if (e) e.onclick = fn; };
  on("#ap", async () => { if (await setPin()) { toast("Mode discret activé"); viewSettings(); } });
  on("#cp", async () => { if (await checkPin() && await setPin()) { toast("Code modifié"); } });
  on("#dp", async () => { if (await checkPin()) { localStorage.removeItem(PIN_KEY); toast("Mode discret désactivé"); viewSettings(); } });
  on("#lk", showLock);
  on("#ub2", () => {
    const o = sheet('<h2>Débloquer tout le monde ?</h2><p class="mut">Les profils que tu as bloqués pourront de nouveau te voir et t’écrire.</p><button class="btn danger" id="y">Oui, débloquer</button><button class="btn ghost" id="n">Annuler</button>');
    $("#n", o).onclick = () => o.remove();
    $("#y", o).onclick = async () => {
      const { error } = await sb.from("blocks").delete().eq("blocker_id", S.user.id);
      o.remove();
      if (error) return toast(fr(error), 1);
      S.queueLoaded = false; toast("Profils débloqués");
    };
  });
  on("#so", () => sb.auth.signOut());
  $("#ai").onchange = e => setPriv("alt_icon", e.target.value);
  $("#nn").onchange = e => setPriv("neutral_notifications", e.target.checked);
  $("#hl").onchange = e => setPriv("hide_last_seen", e.target.checked);
}

/* ============ Lancement ============ */
if (hasPin()) showLock();
boot();
</script>
</body>
</html>
